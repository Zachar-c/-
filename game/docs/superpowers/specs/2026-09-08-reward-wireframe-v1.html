<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>结算屏 线框稿 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    background-color:#e5e2d7;
    background-image: radial-gradient(circle at 0 0, rgba(200,201,190,.9) 1px, transparent 1px);
    background-size: 5px 7px;
    color:#171814;
    position:relative;
  }
  .frame { position:absolute; inset:14px; border:1px dashed #b7b7ab; }
  .seal { position:absolute; width:44px; height:44px; border:2px solid #8c5850; color:#8c5850;
          font-size:12px; line-height:1.25; text-align:center; display:flex; align-items:center; justify-content:center;
          transform: rotate(3deg); letter-spacing:2px; }
  .vtitle { position:absolute; writing-mode:vertical-rl; font-size:30px; letter-spacing:14px; color:#171814; }
  .redline { position:absolute; height:2px; background:#82463e; }
  .bar { position:absolute; top:14px; left:14px; right:14px; height:34px;
         border-bottom:1px solid #b7b7ab; display:flex; align-items:center; gap:12px; font-size:14px; }
  .bar .chip { display:flex; align-items:center; gap:4px; color:#606860; }
  .bar .chip b { color:#171814; font-weight:normal; }
  .corner { position:absolute; top:14px; right:14px; font-size:12px; color:#707870; }
  .ver { position:absolute; bottom:8px; right:14px; font-size:11px; color:#888880; }
  .nav { position:absolute; top:64px; right:14px; width:96px; display:flex; flex-direction:column; gap:18px; font-size:14px; color:#505040; }
  .nav div { text-align:center; }
  .panel { position:absolute; border:1px solid #aaa89f; background:rgba(246,243,233,.55); }
  .card { border:1px solid #9a978c; background:rgba(246,243,233,.6); }
  .ghost { border:1px dashed #c9c6b8; color:#a4a49b; }
  .lab { font-size:12px; color:#607060; }
  .lab b { color:#171814; font-weight:normal; }
  .btn { border:1px solid #aaa89f; padding:4px 12px; font-size:13px; color:#171814; background:transparent; display:inline-block; }
  .btn:hover { border-color:#9c332d; color:#9c332d; }
  .primary { border:1px solid #3880b8; box-shadow:-2px 0 0 #803810; font-size:16px; padding:6px 18px; }
  .tag { display:inline-block; border:1px solid #d5d3c6; background:rgba(255,255,255,.3); font-size:11px; padding:0 4px; color:#56564c; }
  .cost { color:#9c332d; font-size:11px; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="bar">
  <span class="chip">气血 <b>94/120</b></span>
  <span class="chip">寿元 <b>41年</b></span>
  <span class="chip">魂魄 <b>7</b></span>
  <span class="chip">元石 <b>12</b></span>
</div>
<div class="corner">叁宫·南盟</div>
<div class="seal" style="top:60px; right:14px;">得胜<br>录</div>
<div class="vtitle" style="top:120px; left:22px;">结算</div>
<div class="redline" style="top:120px; left:112px; width:180px;"></div>
<div class="lab" style="top:132px; left:112px;">得胜 · 战利三选一</div>

<div class="lab" style="left:112px; top:170px; position:absolute;">此战战利</div>
<div class="card" style="left:112px; top:196px; width:300px; height:200px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; font-size:14px;"><b>毒瘴蛛</b></div>
  <div class="tag" style="left:12px; top:36px; position:absolute;">毒道 · 一阶</div>
  <div class="lab" style="left:12px; top:64px; position:absolute; color:#a4a49b;">瘴气缠身，攻其不备</div>
  <div class="cost" style="left:12px; top:120px; position:absolute;">入手</div>
  <div class="lab" style="left:12px; top:170px; position:absolute; color:#888880;">选择</div>
</div>
<div class="card" style="left:430px; top:196px; width:300px; height:200px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; font-size:14px;"><b>元石 × 8</b></div>
  <div class="lab" style="left:12px; top:64px; position:absolute; color:#a4a49b;">横财入囊</div>
  <div class="lab" style="left:12px; top:170px; position:absolute; color:#888880;">选择</div>
</div>
<div class="card" style="left:748px; top:196px; width:300px; height:200px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; font-size:14px;"><b>生机草</b></div>
  <div class="tag" style="left:12px; top:36px; position:absolute;">木道 · 一阶</div>
  <div class="lab" style="left:12px; top:64px; position:absolute; color:#a4a49b;">净化一层负面</div>
  <div class="lab" style="left:12px; top:170px; position:absolute; color:#888880;">选择</div>
</div>

<div class="lab" style="left:112px; top:430px; position:absolute; color:#888880;">保底计数 · 蛊 0 / 材料 0 · 合成连败 0</div>

<div class="panel" style="left:112px; top:470px; width:936px; height:110px;">
  <div class="lab" style="left:16px; top:14px; position:absolute; color:#a4a49b;">池排除列表：(无)</div>
  <div class="lab" style="left:16px; top:44px; position:absolute; color:#a4a49b;">当前种子 101 · 事件数 2 · DDA 分位 0/10 平稳</div>
  <div style="position:absolute; left:700px; top:32px;">
    <span class="btn primary">继续</span>
  </div>
</div>

<div class="nav">
  <div>手记</div>
  <div>图鉴</div>
  <div>设置</div>
  <div>退出</div>
</div>
<div class="ver">BUILD 0.9.0 - LOCAL</div>
</body>
</html>
