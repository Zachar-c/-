<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>商店屏 线框稿 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    background-color:#e5e2d7;
    background-image: radial-gradient(circle at 0 0, rgba(200,201,190,.9) 1px, transparent 1px);
    background-size: 5px 7px;
    color:#171814;
    position:relative;
  }
  .frame { position:absolute; inset:14px; border:1px dashed #b7b7ab; }
  .bar { position:absolute; top:16px; left:16px; right:16px; height:32px;
         border-bottom:1px solid #b7b7ab; display:flex; align-items:center; gap:18px; font-size:14px; }
  .chip { display:flex; align-items:center; gap:5px; color:#606860; }
  .chip .ic { width:14px; height:14px; border:1px solid #9a978c; }
  .chip b { color:#171814; font-weight:normal; }
  .corner { position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#707870; }
  .seal { position:absolute; top:64px; right:20px; width:44px; height:44px;
          border:2px solid #8c5850; color:#8c5850; font-size:12px; line-height:1.3;
          text-align:center; display:flex; align-items:center; justify-content:center;
          transform: rotate(3deg); letter-spacing:2px; }
  .vtitle { position:absolute; top:130px; left:22px; writing-mode:vertical-rl;
            font-size:28px; letter-spacing:12px; color:#171814; }
  .redline { position:absolute; top:132px; left:112px; width:170px; height:2px; background:#82463e; }
  .sub { position:absolute; top:146px; left:112px; font-size:12px; color:#607060; }
  .sub .hot { color:#887830; }
  .nav { position:absolute; top:124px; right:26px; width:60px; text-align:center;
         display:flex; flex-direction:column; gap:16px; font-size:14px; color:#505040; }
  .nav .on { color:#9c332d; }
  .panel { position:absolute; border:1px solid #aaa89f; background:rgba(246,243,233,.55); }
  .card { border:1px solid #9a978c; background:rgba(246,243,233,.6); }
  .ghost { border:1px dashed #c9c6b8; color:#a4a49b; }
  .lab { font-size:12px; color:#607060; }
  .lab b { color:#171814; font-weight:normal; }
  .tag { display:inline-block; border:1px solid #d5d3c6; background:rgba(255,255,255,.3);
         font-size:11px; padding:0 4px; color:#56564c; }
  .price { color:#9c332d; font-size:12px; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="bar">
  <span class="chip"><span class="ic"></span>气血 <b>94/120</b></span>
  <span class="chip"><span class="ic"></span>寿元 <b>41年</b></span>
  <span class="chip"><span class="ic"></span>魂魄 <b>7</b></span>
  <span class="chip"><span class="ic"></span>元石 <b>12</b></span>
</div>
<div class="corner">叁宫·南盟</div>
<div class="seal">黑市<br>易</div>
<div class="vtitle">黑市</div>
<div class="redline"></div>
<div class="sub">黑市商人 · 童叟无欺 <span class="hot">（已至 3 次涨价）</span></div>
<div class="nav">
  <div>手记</div>
  <div>图鉴</div>
  <div>设置</div>
  <div>退出</div>
</div>
<div style="position:absolute; bottom:10px; right:16px; font-size:11px; color:#888880;">BUILD 0.9.0 - LOCAL</div>

<!-- 主面板：全宽，左货架 + 右服务 -->
<div class="panel" style="left:112px; top:186px; width:1130px; height:420px;">
  <!-- 货架区标题 -->
  <div class="lab" style="left:24px; top:16px; position:absolute;">蛊物 · 货架</div>

  <!-- 商品卡 2×2 -->
  <div class="card" style="left:24px; top:48px; width:360px; height:140px;">
    <div class="lab" style="left:14px; top:12px; position:absolute; font-size:14px;"><b>毒瘴蛛</b></div>
    <div class="tag" style="left:14px; top:40px; position:absolute;">毒道 · 一阶</div>
    <div class="lab" style="left:14px; top:72px; position:absolute; color:#a4a49b;">瘴气缠身，攻其不备</div>
    <div class="price" style="left:14px; top:104px; position:absolute;">6 元石</div>
  </div>
  <div class="card" style="left:404px; top:48px; width:360px; height:140px;">
    <div class="lab" style="left:14px; top:12px; position:absolute; font-size:14px;"><b>生机草</b></div>
    <div class="tag" style="left:14px; top:40px; position:absolute;">木道 · 一阶</div>
    <div class="lab" style="left:14px; top:72px; position:absolute; color:#a4a49b;">净化一层负面</div>
    <div class="price" style="left:14px; top:104px; position:absolute;">3 元石</div>
  </div>
  <div class="card" style="left:24px; top:206px; width:360px; height:140px;">
    <div class="lab" style="left:14px; top:12px; position:absolute; font-size:14px;"><b>石皮蛊</b></div>
    <div class="tag" style="left:14px; top:40px; position:absolute;">土道 · 一阶</div>
    <div class="lab" style="left:14px; top:72px; position:absolute; color:#a4a49b;">获得护盾</div>
    <div class="price" style="left:14px; top:104px; position:absolute;">5 元石</div>
  </div>
  <div class="ghost" style="left:404px; top:206px; width:360px; height:140px;">
    <div class="lab" style="left:14px; top:12px; position:absolute;">已售罄</div>
    <div class="lab" style="left:14px; top:72px; position:absolute; color:#a4a49b;">货架告罄时以保底池补给</div>
  </div>

  <!-- 货架/服务分隔 -->
  <div style="position:absolute; left:790px; top:16px; width:1px; height:388px; background:#b7b7ab;"></div>

  <!-- 服务区 -->
  <div class="lab" style="left:822px; top:16px; position:absolute;">杂项 · 服务</div>
  <div class="card" style="left:822px; top:48px; width:270px; height:64px;">
    <div class="lab" style="left:14px; top:10px; position:absolute;">疗伤</div>
    <div class="price" style="left:14px; top:38px; position:absolute;">8 元石</div>
  </div>
  <div class="card" style="left:822px; top:124px; width:270px; height:64px;">
    <div class="lab" style="left:14px; top:10px; position:absolute;">情报</div>
    <div class="price" style="left:14px; top:38px; position:absolute;">5 元石</div>
  </div>
  <div class="lab" style="left:822px; top:224px; position:absolute; color:#888880; line-height:22px;">
    态度 · 冷淡<br>（购货越多越热络）</div>
</div>
</body>
</html>
