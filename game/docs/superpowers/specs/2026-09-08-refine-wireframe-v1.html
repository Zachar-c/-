<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>炼蛊屏 线框稿 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    background-color:#e5e2d7;
    background-image: radial-gradient(circle at 0 0, rgba(200,201,190,.9) 1px, transparent 1px);
    background-size: 5px 7px;
    color:#171814;
    position:relative;
  }
  .frame { position:absolute; inset:14px; border:1px dashed #b7b7ab; }
  .seal { position:absolute; width:44px; height:44px; border:2px solid #8c5850; color:#8c5850;
          font-size:12px; line-height:1.25; text-align:center; display:flex; align-items:center; justify-content:center;
          transform: rotate(3deg); letter-spacing:2px; }
  .vtitle { position:absolute; writing-mode:vertical-rl; font-size:30px; letter-spacing:14px; color:#171814; }
  .redline { position:absolute; height:2px; background:#82463e; }
  .bar { position:absolute; top:14px; left:14px; right:14px; height:34px;
         border-bottom:1px solid #b7b7ab; display:flex; align-items:center; gap:12px; font-size:14px; }
  .bar .chip { display:flex; align-items:center; gap:4px; color:#606860; }
  .bar .chip b { color:#171814; font-weight:normal; }
  .corner { position:absolute; top:14px; right:14px; font-size:12px; color:#707870; }
  .ver { position:absolute; bottom:8px; right:14px; font-size:11px; color:#888880; }
  .nav { position:absolute; top:64px; right:14px; width:96px; display:flex; flex-direction:column; gap:18px; font-size:14px; color:#505040; }
  .nav div { text-align:center; }
  .panel { position:absolute; border:1px solid #aaa89f; background:rgba(246,243,233,.55); }
  .card { border:1px solid #9a978c; background:rgba(246,243,233,.6); }
  .ghost { border:1px dashed #c9c6b8; color:#a4a49b; }
  .lab { font-size:12px; color:#607060; }
  .lab b { color:#171814; font-weight:normal; }
  .btn { border:1px solid #aaa89f; padding:4px 10px; font-size:13px; color:#171814; background:transparent; display:inline-block; }
  .btn:hover { border-color:#9c332d; color:#9c332d; }
  .primary { border:1px solid #3880b8; box-shadow:-2px 0 0 #803810; font-size:16px; padding:6px 18px; }
  .tab { font-size:15px; color:#171814; border-bottom:2px solid #82463e; padding-bottom:2px; }
  .tab.off { color:#707870; border-bottom:none; }
  .tag { display:inline-block; border:1px solid #d5d3c6; background:rgba(255,255,255,.3); font-size:11px; padding:0 4px; color:#56564c; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="bar">
  <span class="chip">气血 <b>94/120</b></span>
  <span class="chip">寿元 <b>41年</b></span>
  <span class="chip">魂魄 <b>7</b></span>
  <span class="chip">元石 <b>12</b></span>
</div>
<div class="corner">叁宫·南盟</div>
<div class="seal" style="top:60px; right:14px;">炼蛊<br>养道</div>
<div class="vtitle" style="top:120px; left:22px;">炼蛊</div>
<div class="redline" style="top:120px; left:112px; width:180px;"></div>
<div class="lab" style="top:132px; left:112px;">以蛊炼蛊 · 化毒为药</div>

<div class="panel" style="left:112px; top:168px; width:870px; height:420px;">
  <div style="position:absolute; left:16px; top:12px;">
    <span class="tab">炼制</span>&nbsp;&nbsp;<span class="tab off">拆解</span>
  </div>
  <div class="lab" style="left:16px; top:48px; position:absolute;">炼制格</div>
  <div class="card" style="left:16px; top:74px; width:130px; height:120px;"></div>
  <div class="card" style="left:156px; top:74px; width:130px; height:120px;"></div>
  <div class="lab" style="left:296px; top:74px; width:120px; line-height:22px; font-size:12px; color:#607060;">+<br>蛊虫中文名<br>可炼组合提示</div>
  <div class="lab" style="left:16px; top:210px; position:absolute;">炼出</div>
  <div class="card" style="left:16px; top:236px; width:180px; height:130px;">
    <div class="lab" style="left:8px; top:8px; position:absolute;">蛊名</div>
    <div class="lab" style="left:8px; top:30px; position:absolute; color:#a4a49b;">序文 · 品阶</div>
    <div class="lab" style="left:8px; top:80px; position:absolute; color:#9c332d;">念头 2</div>
  </div>
  <div class="lab" style="left:220px; top:236px; position:absolute; width:160px; line-height:20px; color:#888880;">连击<br>连成次数 0<br>（越连越精）</div>
  <div style="position:absolute; left:600px; top:300px;">
    <span class="btn primary">炼 制</span>
  </div>
</div>

<div class="panel" style="left:1000px; top:168px; width:250px; height:420px;">
  <div class="lab" style="left:14px; top:12px; position:absolute;">蛊囊</div>
  <div class="card" style="left:14px; top:38px; width:220px; height:56px;">
    <div class="lab" style="left:8px; top:6px; position:absolute;">月光蛊</div>
    <div class="tag" style="left:8px; top:30px; position:absolute;">光道</div>
  </div>
  <div class="card" style="left:14px; top:104px; width:220px; height:56px;">
    <div class="lab" style="left:8px; top:6px; position:absolute;">石皮蛊</div>
    <div class="tag" style="left:8px; top:30px; position:absolute;">土道</div>
  </div>
  <div class="ghost card" style="left:14px; top:170px; width:220px; height:56px;">
    <div class="lab" style="left:8px; top:6px; position:absolute;">空位</div>
  </div>
</div>

<div class="nav">
  <div>手记</div>
  <div>图鉴</div>
  <div>设置</div>
  <div>退出</div>
</div>
<div class="ver">BUILD 0.9.0 - LOCAL</div>
</body>
</html>
