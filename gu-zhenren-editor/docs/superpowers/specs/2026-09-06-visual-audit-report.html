<script>
(function(){
try{
var data=[
{name:"视觉资产完备度",score:1,color:"#9c332d",note:"仅2张PNG+28个极简SVG，零蛊虫/敌人/场景/特效资产"},
{name:"设计文档落地率",score:2,color:"#9c332d",note:"三层结构只实现规则层，11种动效词汇全缺"},
{name:"蛊虫系统视觉",score:1,color:"#9c332d",note:"无蛊虫图鉴图像，纯文字+品质色边框"},
{name:"战斗视觉表现",score:1,color:"#9c332d",note:"纯UI面板堆叠，零立绘/背景/特效，与基准屏要求差距最大"},
{name:"UI规范合规性",score:3,color:"#936f1e",note:"7处圆角8px违规，5+处硬编码颜色，全局主题缺失"},
{name:"色彩体系一致性",score:4,color:"#936f1e",note:"gu_style本身合理，但rarity/quality两套品质色矛盾"},
{name:"地图视觉表现",score:3,color:"#936f1e",note:"布局完整但路径仅1px直线，无墨线落笔/因果回读视觉"},
{name:"动效与反馈",score:2,color:"#9c332d",note:"仅0.22s黑幕淡入淡出，无朱砂盖印/墨迹扩散等"},
{name:"大厅叙事视觉",score:3,color:"#936f1e",note:"2张AI水墨图风格偏明亮，缺志怪湿冷感，未有效接入"},
{name:"工程可维护性",score:5,color:"#315f73",note:"组件化架构好，但残留诊断代码，视觉分支未合并"}
];
var host=document.getElementById("bars");
if(host){
data.forEach(function(d){
var row=document.createElement("div");
row.style.cssText="display:flex;align-items:center;gap:10px;margin-bottom:8px;";
var label=document.createElement("div");
label.style.cssText="width:110px;font-size:12px;color:#171814;font-weight:500;flex-shrink:0;";
label.textContent=d.name;
var track=document.createElement("div");
track.style.cssText="flex:1;height:16px;background:#ddd8cc;border-radius:2px;position:relative;overflow:hidden;";
var fill=document.createElement("div");
fill.style.cssText="position:absolute;left:0;top:0;height:100%;width:"+(d.score*10)+"%;background:"+d.color+";";
track.appendChild(fill);
var num=document.createElement("div");
num.style.cssText="width:32px;text-align:right;font-size:12px;color:"+d.color+";font-weight:700;";
num.textContent=d.score+"/10";
var note=document.createElement("div");
note.style.cssText="width:240px;font-size:10.5px;color:#686960;flex-shrink:0;";
note.textContent=d.note;
row.appendChild(label);
row.appendChild(track);
row.appendChild(num);
row.appendChild(note);
host.appendChild(row);
});
}
}catch(e){}
})();
</script>
