<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>设置屏 线框稿 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    background-color:#e5e2d7;
    background-image: radial-gradient(circle at 0 0, rgba(200,201,190,.9) 1px, transparent 1px);
    background-size: 5px 7px;
    color:#171814;
    position:relative;
  }
  .frame { position:absolute; inset:14px; border:1px dashed #b7b7ab; }
  .bar { position:absolute; top:16px; left:16px; right:16px; height:32px;
         border-bottom:1px solid #b7b7ab; display:flex; align-items:center; gap:18px; font-size:14px; }
  .chip { display:flex; align-items:center; gap:5px; color:#606860; }
  .chip .ic { width:14px; height:14px; border:1px solid #9a978c; }
  .chip b { color:#171814; font-weight:normal; }
  .corner { position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#707870; }
  .seal { position:absolute; top:64px; right:20px; width:44px; height:44px;
          border:2px solid #8c5850; color:#8c5850; font-size:12px; line-height:1.3;
          text-align:center; display:flex; align-items:center; justify-content:center;
          transform: rotate(3deg); letter-spacing:2px; }
  .vtitle { position:absolute; top:130px; left:22px; writing-mode:vertical-rl;
            font-size:28px; letter-spacing:12px; color:#171814; }
  .redline { position:absolute; top:132px; left:112px; width:170px; height:2px; background:#82463e; }
  .sub { position:absolute; top:146px; left:112px; font-size:12px; color:#607060; }
  .nav { position:absolute; top:124px; right:26px; width:60px; text-align:center;
         display:flex; flex-direction:column; gap:16px; font-size:14px; color:#505040; }
  .nav .on { color:#9c332d; }
  .panel { position:absolute; border:1px solid #aaa89f; background:rgba(246,243,233,.55); }
  .lab { font-size:13px; color:#171814; }
  .lab small { font-size:12px; color:#607060; }
  .btn { border:1px solid #aaa89f; padding:4px 14px; font-size:13px; color:#171814; background:transparent; }
  .btn:hover { border-color:#9c332d; color:#9c332d; }
  .opt { display:inline-block; border:1px solid #aaa89f; padding:5px 14px; font-size:13px; color:#505040; margin-right:10px; }
  .opt.on { border:1px solid #9a978c; background:rgba(246,243,233,.6); color:#171814; }
  .divider { position:absolute; height:1px; background:#b7b7ab; }
  .track { position:absolute; height:4px; background:#d5d3c6; }
  .fill { position:absolute; height:4px; background:#9a978c; }
  .thumb { position:absolute; width:12px; height:12px; border:1px solid #9a978c; background:#e5e2d7; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="bar">
  <span class="chip"><span class="ic"></span>气血 <b>94/120</b></span>
  <span class="chip"><span class="ic"></span>寿元 <b>41年</b></span>
  <span class="chip"><span class="ic"></span>魂魄 <b>7</b></span>
  <span class="chip"><span class="ic"></span>元石 <b>12</b></span>
</div>
<div class="corner">叁宫·南盟</div>
<div class="seal">设置<br>阁</div>
<div class="vtitle">设置</div>
<div class="redline"></div>
<div class="sub">声色之调 · 存于机匣</div>
<div class="nav">
  <div>手记</div>
  <div>图鉴</div>
  <div class="on">设置</div>
  <div>退出</div>
</div>
<div style="position:absolute; bottom:10px; right:16px; font-size:11px; color:#888880;">BUILD 0.9.0 - LOCAL</div>

<!-- 主面板：全宽 -->
<div class="panel" style="left:112px; top:186px; width:1130px; height:420px;">
  <!-- 声音 -->
  <div class="lab" style="left:30px; top:28px; position:absolute;">声音 <small>· 主音量</small></div>
  <div class="lab" style="left:30px; top:76px; position:absolute; font-size:15px;"><b>100</b></div>
  <div class="track" style="left:110px; top:84px; width:440px;"></div>
  <div class="fill" style="left:110px; top:84px; width:440px;"></div>
  <div class="thumb" style="left:542px; top:80px;"></div>
  <div style="position:absolute; left:600px; top:70px;"><span class="btn">静音</span></div>

  <div class="divider" style="left:30px; top:130px; width:1070px;"></div>

  <!-- 显示 -->
  <div class="lab" style="left:30px; top:156px; position:absolute;">显示 <small>· 窗口分辨率</small></div>
  <div style="position:absolute; left:30px; top:198px;">
    <span class="opt on">全屏</span>
    <span class="opt">1920×1080 · 窗口</span>
    <span class="opt">1600×900 · 窗口</span>
    <span class="opt">1280×720 · 窗口</span>
  </div>
  <div class="lab" style="left:30px; top:248px; position:absolute; color:#888880;">当前 1280×720 · 窗口（与基准 1:1）</div>

  <div class="divider" style="left:30px; top:290px; width:1070px;"></div>

  <!-- 存档 -->
  <div class="lab" style="left:30px; top:316px; position:absolute;">存档 <small>· 本机</small></div>
  <div style="position:absolute; left:30px; top:352px;">
    <span class="btn">保存</span>&nbsp;&nbsp;<span class="btn">读档</span>
  </div>
</div>
</body>
</html>
