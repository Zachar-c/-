<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>杀招屏 线框稿 v1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    background-color:#e5e2d7;
    background-image: radial-gradient(circle at 0 0, rgba(200,201,190,.9) 1px, transparent 1px);
    background-size: 5px 7px;
    color:#171814;
    position:relative;
  }
  .frame { position:absolute; inset:14px; border:1px dashed #b7b7ab; }
  .seal { position:absolute; width:44px; height:44px; border:2px solid #8c5850; color:#8c5850;
          font-size:12px; line-height:1.25; text-align:center; display:flex; align-items:center; justify-content:center;
          transform: rotate(3deg); letter-spacing:2px; }
  .vtitle { position:absolute; writing-mode:vertical-rl; font-size:30px; letter-spacing:14px; color:#171814; }
  .redline { position:absolute; height:2px; background:#82463e; }
  .bar { position:absolute; top:14px; left:14px; right:14px; height:34px;
         border-bottom:1px solid #b7b7ab; display:flex; align-items:center; gap:12px; font-size:14px; }
  .bar .chip { display:flex; align-items:center; gap:4px; color:#606860; }
  .bar .chip b { color:#171814; font-weight:normal; }
  .corner { position:absolute; top:14px; right:14px; font-size:12px; color:#707870; }
  .ver { position:absolute; bottom:8px; right:14px; font-size:11px; color:#888880; }
  .nav { position:absolute; top:64px; right:14px; width:96px; display:flex; flex-direction:column; gap:18px; font-size:14px; color:#505040; }
  .nav div { text-align:center; }
  .card { border:1px solid #9a978c; background:rgba(246,243,233,.6); }
  .ghost { border:1px dashed #c9c6b8; color:#a4a49b; }
  .lab { font-size:12px; color:#607060; }
  .lab b { color:#171814; font-weight:normal; }
  .btn { border:1px solid #aaa89f; padding:4px 12px; font-size:13px; color:#171814; background:transparent; display:inline-block; }
  .btn:hover { border-color:#9c332d; color:#9c332d; }
  .tag { display:inline-block; border:1px solid #d5d3c6; background:rgba(255,255,255,.3); font-size:11px; padding:0 4px; color:#56564c; }
  .cost { color:#9c332d; font-size:11px; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="bar">
  <span class="chip">气血 <b>94/120</b></span>
  <span class="chip">寿元 <b>41年</b></span>
  <span class="chip">魂魄 <b>7</b></span>
  <span class="chip">元石 <b>12</b></span>
</div>
<div class="corner">叁宫·南盟</div>
<div class="seal" style="top:60px; right:14px;">杀招<br>录</div>
<div class="vtitle" style="top:120px; left:22px;">杀招</div>
<div class="redline" style="top:120px; left:112px; width:180px;"></div>
<div class="lab" style="top:132px; left:112px;">以命搏命 · 杀招研习录</div>

<div class="lab" style="left:112px; top:170px; position:absolute;">已研习</div>
<div class="card" style="left:112px; top:196px; width:300px; height:170px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; font-size:14px;"><b>月噬</b></div>
  <div class="tag" style="left:12px; top:34px; position:absolute;">光月 Ⅱ</div>
  <div class="lab" style="left:12px; top:62px; position:absolute; color:#a4a49b;">以月为刃，噬其精血</div>
  <div class="lab" style="left:12px; top:120px; position:absolute; color:#607060;">研习自 · 毒瘴蛛</div>
  <div class="cost" style="left:12px; top:142px; position:absolute;">念头 6</div>
</div>
<div class="ghost card" style="left:430px; top:196px; width:300px; height:170px;">
  <div class="lab" style="left:12px; top:10px; position:absolute;">未研习</div>
  <div class="lab" style="left:12px; top:60px; position:absolute; color:#a4a49b;">来源 · 战斗后研习</div>
</div>
<div class="ghost card" style="left:748px; top:196px; width:300px; height:170px;">
  <div class="lab" style="left:12px; top:10px; position:absolute;">未研习</div>
  <div class="lab" style="left:12px; top:60px; position:absolute; color:#a4a49b;">来源 · 战斗后研习</div>
</div>

<div class="lab" style="left:112px; top:400px; position:absolute;">杀招栏位</div>
<div class="card" style="left:112px; top:426px; width:300px; height:64px;">
  <div class="lab" style="left:12px; top:10px; position:absolute;">栏一 · 月噬</div>
  <div class="tag" style="left:12px; top:34px; position:absolute;">已装备</div>
</div>
<div class="card" style="left:430px; top:426px; width:300px; height:64px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; color:#a4a49b;">栏二 · 空</div>
</div>
<div class="card" style="left:748px; top:426px; width:300px; height:64px;">
  <div class="lab" style="left:12px; top:10px; position:absolute; color:#a4a49b;">栏三 · 空</div>
</div>

<div class="nav">
  <div>手记</div>
  <div>图鉴</div>
  <div>设置</div>
  <div>退出</div>
</div>
<div class="ver">BUILD 0.9.0 - LOCAL</div>
</body>
</html>
